<svg viewBox="0 0 680 560" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>WordWorld 数据流图</title>
<desc>用户英文描述经本地解析套用到素材生成变体，存入本地素材库与场景，可导出分享；云端与第三方生成仅为用户主动可选路径。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g class="c-blue">
<rect x="40" y="40" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">用户输入英文描述</text>
<text x="130" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">输入框</text>
</g>

<g class="c-teal">
<rect x="40" y="160" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="130" y="180" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">本地解析</text>
<text x="130" y="200" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">小模型 / 词典兜底</text>
</g>

<g class="c-purple">
<rect x="40" y="280" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="130" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">得到一组参数</text>
<text x="130" y="320" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">颜色 / 尺寸 / 形状</text>
</g>

<g class="c-coral">
<rect x="40" y="400" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="130" y="420" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">套到预制 / 免费素材</text>
<text x="130" y="440" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">生成变体素材</text>
</g>

<g class="c-green">
<rect x="300" y="400" width="180" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="390" y="420" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">存入「我的素材」</text>
<text x="390" y="440" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">本地 IndexedDB</text>
</g>

<g class="c-amber">
<rect x="300" y="280" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="390" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">拖进 3D 场景</text>
<text x="390" y="320" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">摆放 / 调整</text>
</g>

<g class="c-amber">
<rect x="300" y="160" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="390" y="180" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">存档 / 导出分享</text>
<text x="390" y="200" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">JSON · PNG</text>
</g>

<g class="c-gray">
<rect x="300" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="390" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">云端 AI API</text>
<text x="390" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">可选 · 经预留窗口</text>
</g>

<g class="c-gray">
<rect x="520" y="40" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="590" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">第三方生成平台</text>
<text x="590" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">新窗口 · 手动导入</text>
</g>

<path d="M130 96 L130 160" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M130 216 L130 280" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M130 336 L130 400" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M220 428 L300 428" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M390 428 L390 336" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M390 280 L390 216" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M220 188 C 260 188 260 68 300 68" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>
<path d="M480 68 L520 68" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>
<path d="M590 96 C 590 380 480 420 480 420" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>

<text x="130" y="530" text-anchor="middle" font-size="12" fill="#888780">实线 = 默认本地路径（数据不出本机）</text>
<text x="420" y="530" text-anchor="middle" font-size="12" fill="#888780">虚线 = 用户主动可选路径（数据出本机，需二次确认）</text>
</svg>
